[project]
name = "warpfield"
version = "0.1.0"
description = "Error-bounded, seam-free lossy compression of registration displacement fields"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Forrest Collman", email = "forrestc@alleninstitute.org" }]
keywords = ["registration", "displacement field", "lossy", "error-bounded", "compression", "zarr"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = ["numpy>=1.25", "zstandard>=0.22"]

[project.optional-dependencies]
# the Rust implementation (10-30x faster, bit-identical); used automatically when installed
fast = ["warpfield-rs>=0.1"]
# the zarr v3 codec (a separate distribution: zarr-warpfield)
zarr = ["zarr-warpfield>=0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warpfield"]

[dependency-groups]
dev = [
  "pytest>=8",
  "zarr>=3",
  "zarr-warpfield",
  "ruff>=0.6",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "jsonschema>=4",
]

# The zarr plugin is developed alongside the core.
[tool.uv.workspace]
members = ["plugins/zarr"]

[tool.uv.sources]
warpfield-rs = { path = "rust/warpfield-py" }
zarr-warpfield = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 96
src = ["src", "plugins/zarr/src", "tests", "scripts"]
extend-exclude = ["rust"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"scripts/gallery_page.py" = ["E501"]
"examples/**" = ["E501"]
