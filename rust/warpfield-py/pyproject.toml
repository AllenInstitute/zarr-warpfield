[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "zarr-warpfield-rs"
description = "Rust implementation of the zarr `warpfield` codec, used by zarr-warpfield when installed"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["numpy>=1.25"]
version = "0.1.0"
classifiers = ["Programming Language :: Rust", "Programming Language :: Python :: 3"]

[tool.maturin]
module-name = "zarr_warpfield_rs"
features = ["pyo3/extension-module"]
