[workspace]
resolver = "3"
members = ["warpfield", "warpfield-py", "warpfield-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# wasm: small and fast
[profile.release-wasm]
inherits = "release"
opt-level = 3
strip = true
