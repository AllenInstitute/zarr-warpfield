[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "warpfield-rs"
description = "Rust implementation of the warpfield codec, used by the warpfield package when installed"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["numpy>=1.25"]
version = "0.1.0"
classifiers = ["Programming Language :: Rust", "Programming Language :: Python :: 3"]

[tool.maturin]
module-name = "warpfield_rs"
features = ["pyo3/extension-module"]
