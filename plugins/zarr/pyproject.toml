[project]
name = "zarr-warpfield"
version = "0.1.0"
description = "The warpfield codec for Zarr v3: error-bounded, seam-free compression of displacement fields"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Forrest Collman", email = "forrestc@alleninstitute.org" }]
keywords = ["zarr", "codec", "registration", "displacement field", "lossy", "error-bounded"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = ["warpfield>=0.1", "zarr>=3"]

[project.optional-dependencies]
fast = ["warpfield[fast]>=0.1"]

# How zarr discovers the codec once this package is installed. The entry-point
# name must be the codec's name as it appears in array metadata.
[project.entry-points."zarr.codecs"]
warpfield = "zarr_warpfield:WarpFieldCodec"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zarr_warpfield"]

[tool.uv.sources]
warpfield = { workspace = true }
