[package]
name = "warpfield-py"
description = "Python bindings for the warpfield codec (module zarr_warpfield_rs)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "zarr_warpfield_rs"
crate-type = ["cdylib"]

[dependencies]
warpfield = { path = "../warpfield" }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py311"] }
numpy = "0.30"
